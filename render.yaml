services:
  - type: web
    name: surfacestride-trail-server
    runtime: node
    plan: free
    repo: https://github.com/kai610390-source/RunELITE_LOGIX
    branch: trails-live
    autoDeployTrigger: checksPass
    rootDir: .
    buildCommand: node --test server/server.test.mjs
    startCommand: node server/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: USER_AGENT_CONTACT
        sync: false
